name: freshdesk_sdk
description: Official Flutter plugin for Freshdesk Mobile SDK. Integrate customer support chat, ticketing, and help desk features with real-time messaging and JWT authentication.
version: 1.0.0
homepage: https://github.com/ashwindots/freshdesk_sdk
repository: https://github.com/ashwindots/freshdesk_sdk
issue_tracker: https://github.com/ashwindots/freshdesk_sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.snapnfix.freshdesk_sdk
        pluginClass: FreshdeskSdkPlugin
      ios:
        pluginClass: FreshdeskSdkPlugin
